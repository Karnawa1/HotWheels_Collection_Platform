# ===========================================
# Hot Wheels Platform - Nginx Routes
# ===========================================

# -----------------------------------------
# API Routes
# -----------------------------------------
location /api/ {
    limit_req zone=api_limit burst=20 nodelay;

    proxy_pass http://api_backend/;
    proxy_http_version 1.1;
    
    # Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Buffer settings
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
}

# -----------------------------------------
# API Health Check
# -----------------------------------------
location /api/health {
    proxy_pass http://api_backend/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
}

# -----------------------------------------
# Auth Routes (Stricter Rate Limiting)
# -----------------------------------------
location /api/auth/login {
    limit_req zone=login_limit burst=5 nodelay;

    proxy_pass http://api_backend/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/auth/register {
    limit_req zone=login_limit burst=3 nodelay;

    proxy_pass http://api_backend/auth/register;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# -----------------------------------------
# Static Files from API (Uploads)
# -----------------------------------------
location /uploads/ {
    proxy_pass http://api_backend/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    
    # Cache static files
    expires 7d;
    add_header Cache-Control "public, immutable";
}

# -----------------------------------------
# Frontend Routes (Next.js)
# -----------------------------------------
location / {
    proxy_pass http://frontend_backend;
    proxy_http_version 1.1;
    
    # Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # WebSocket support (for HMR in development)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# -----------------------------------------
# Next.js Static Files
# -----------------------------------------
location /_next/static/ {
    proxy_pass http://frontend_backend/_next/static/;
    proxy_http_version 1.1;
    
    # Cache static files aggressively
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# -----------------------------------------
# Favicon and Static Assets
# -----------------------------------------
location ~* \.(ico|css|js|gif|jpe?g|png|svg|woff2?)$ {
    proxy_pass http://frontend_backend;
    proxy_http_version 1.1;
    
    expires 7d;
    add_header Cache-Control "public";
}
