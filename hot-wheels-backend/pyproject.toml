# ===========================================
# Hot Wheels Backend - Python Project Configuration
# ===========================================

[project]
name = "hot-wheels-backend"
version = "1.0.0"
description = "Hot Wheels Collector Platform - Flask API Backend"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.black]
# Black code formatter configuration
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.pytest_cache
    | __pycache__
    | migrations
    | venv
    | \.venv
    | build
    | dist
)/
'''

[tool.isort]
# Import sorting configuration
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "migrations"
]
known_first_party = ["app"]
known_third_party = [
    "flask",
    "sqlalchemy",
    "pytest",
    "redis",
    "pymongo"
]
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER"
]

[tool.pytest.ini_options]
# Pytest configuration (supplements pytest.ini)
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -ra"
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require database)",
    "slow: Slow tests that take more time"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

[tool.coverage.run]
# Coverage configuration
source = ["app"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/.venv/*"
]

[tool.coverage.report]
# Coverage reporting
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:"
]
fail_under = 60
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
# Bandit security linter configuration
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]  # Skip assert warnings in non-test code

[tool.mypy]
# Type checking configuration (optional, for future use)
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = [
    "migrations",
    "venv",
    ".venv"
]

