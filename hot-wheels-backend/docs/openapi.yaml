  # ==================== Marketplace ====================
  /api/v1/marketplace/listings:
    get:
      summary: Get marketplace listings
      description: |
        Returns active marketplace listings with optional filters.

        **Filtering Options:**
        - By car model ID
        - By listing type (sale/trade/auction)
        - By seller
        - By price range
      tags:
        - Marketplace
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: model_id
          in: query
          description: Filter by car model
          schema:
            type: integer
        - name: listing_type
          in: query
          description: Filter by listing type
          schema:
            type: string
            enum: [sale, trade, auction]
        - name: seller_id
          in: query
          description: Filter by seller
          schema:
            type: integer
        - name: price_min
          in: query
          description: Minimum price
          schema:
            type: number
            format: float
        - name: price_max
          in: query
          description: Maximum price
          schema:
            type: number
            format: float
      responses:
        '200':
          description: Listings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      listings:
                        type: array
                        items:
                          $ref: '#/components/schemas/Listing'
                      pagination:
                        $ref: '#/components/schemas/PaginationMeta'
    post:
      summary: Create a listing
      description: Creates a new marketplace listing
      tags:
        - Marketplace
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListingRequest'
            examples:
              sale:
                summary: Sale listing
                value:
                  model_id: 1
                  listing_type: "sale"
                  condition: "Mint"
                  price: 15.99
                  description: "Pristine condition, never opened"
              trade:
                summary: Trade listing
                value:
                  model_id: 1
                  listing_type: "trade"
                  condition: "Near Mint"
                  description: "Looking to trade for Chase variants"
      responses:
        '201':
          description: Listing created
