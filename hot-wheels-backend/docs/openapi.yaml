openapi: 3.1.0
info:
  title: Hot Wheels Collector API
  version: 1.0.0
  description: |
    # Hot Wheels Collector Platform API

    A comprehensive REST API for Hot Wheels collectors to manage their collections,
    trade with other collectors, and explore the complete Hot Wheels catalog.

    ## Features
    - **Authentication**: JWT-based secure authentication system
    - **Catalog**: Browse 50+ years of Hot Wheels models
    - **Collections**: Track and manage personal collections
    - **Marketplace**: Buy, sell, and trade with other collectors
    - **Reviews**: Rate and review transactions

    ## Getting Started
    1. Register a new account via `/api/v1/auth/register`
    2. Login to receive JWT tokens via `/api/v1/auth/login`
    3. Include the access token in the `Authorization` header
    4. Start exploring the catalog and managing your collection!

    ## Rate Limits
    - Anonymous users: 100 requests/minute
    - Authenticated users: 500 requests/minute
    - Rate limit headers included in all responses

    ## Support
    For API support, please contact the development team.

  contact:
    name: API Support
    email: support@hotwheels-collector.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:5000
    description: Development server
  - url: https://api.hotwheels-collector.com
    description: Production server

tags:
  - name: Authentication
    description: User authentication and account management
  - name: Catalog
    description: Browse Hot Wheels models, castings, and series
  - name: Collections
    description: Manage personal collections and wishlists
  - name: Marketplace
    description: Listings, transactions, and reviews

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token obtained from `/api/v1/auth/login`.
        Include in Authorization header: `Bearer <token>`

  schemas:
    # ==================== Common Schemas ====================
    Error:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            message:
              type: string
              example: "Invalid request parameters"
            code:
              type: string
              example: "VALIDATION_ERROR"

    SuccessResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        message:
          type: string
          nullable: true

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          example: 150
        total_pages:
          type: integer
          example: 8
        has_next:
          type: boolean
          example: true
        has_prev:
          type: boolean
          example: false

    # ==================== User Schemas ====================
    User:
      type: object
      properties:
        user_id:
          type: integer
          example: 1
        username:
          type: string
          example: "hotwheels_fan"
        full_name:
          type: string
          nullable: true
          example: "John Smith"
        country:
          type: string
          nullable: true
          example: "United States"
        city:
          type: string
          nullable: true
          example: "Los Angeles"
        profile_image_url:
          type: string
          nullable: true
          example: "https://example.com/avatar.jpg"
        bio:
          type: string
          nullable: true
          example: "Collecting Hot Wheels since 1985"
        is_verified:
          type: boolean
          example: false
        is_active:
          type: boolean
          example: true
        role:
          type: string
          enum: [collector, trader, admin, moderator]
          example: "collector"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        last_login:
          type: string
          format: date-time
          nullable: true
          example: "2024-12-17T08:00:00Z"

    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          example: "hotwheels_fan"
        email:
          type: string
          format: email
          example: "collector@example.com"
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
          example: "SecureP@ss123"
        full_name:
          type: string
          nullable: true
          example: "John Smith"
        country:
          type: string
          nullable: true
          example: "United States"
        city:
          type: string
          nullable: true
          example: "Los Angeles"
        bio:
          type: string
          nullable: true
          example: "Passionate Hot Wheels collector"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "collector@example.com"
        password:
          type: string
          format: password
          example: "SecureP@ss123"

    AuthTokens:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          example: "bearer"
        expires_in:
          type: integer
          example: 86400
          description: Token expiration time in seconds

    UpdateProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          nullable: true
          example: "John Smith Jr."
        country:
          type: string
          nullable: true
          example: "Canada"
        city:
          type: string
          nullable: true
          example: "Toronto"
        bio:
          type: string
          nullable: true
          example: "Updated bio"
        profile_image_url:
          type: string
          nullable: true
          example: "https://example.com/new-avatar.jpg"

    ChangePasswordRequest:
      type: object
      required:
        - old_password
        - new_password
      properties:
        old_password:
          type: string
          format: password
          example: "OldP@ss123"
        new_password:
          type: string
          minLength: 8
          format: password
          example: "NewSecureP@ss456"

    # ==================== Catalog Schemas ====================
    Manufacturer:
      type: object
      properties:
        manufacturer_id:
          type: integer
          example: 1
        name:
          type: string
          example: "Mattel"
        country:
          type: string
          nullable: true
          example: "United States"
        founded_year:
          type: integer
          nullable: true
          example: 1945
        created_at:
          type: string
          format: date-time

    Casting:
      type: object
      properties:
        casting_id:
          type: integer
          example: 1
        casting_name:
          type: string
          example: "'67 Camaro"
        first_release_year:
          type: integer
          example: 1968
        manufacturer_id:
          type: integer
          nullable: true
          example: 1
        scale:
          type: string
          example: "1:64"
        designer:
          type: string
          nullable: true
          example: "Harry Bradley"
        based_on_real_car:
          type: boolean
          example: true
        real_car_model:
          type: string
          nullable: true
          example: "1967 Chevrolet Camaro"
        created_at:
          type: string
          format: date-time

    Series:
      type: object
      properties:
        series_id:
          type: integer
          example: 1
        series_name:
          type: string
          example: "Mainline 2024"
        release_year:
          type: integer
          example: 2024
        manufacturer_id:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true
          example: "Standard mainline series"
        is_limited_edition:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time

    CarModel:
      type: object
      properties:
        model_id:
          type: integer
          example: 1
        casting_id:
          type: integer
          example: 1
        series_id:
          type: integer
          nullable: true
          example: 1
        release_year:
          type: integer
          example: 2024
        color:
          type: string
          example: "Spectraflame Red"
        tampo_design:
          type: string
          nullable: true
          example: "Racing stripes with #7"
        wheel_type:
          type: string
          nullable: true
          example: "5-Spoke"
        base_color:
          type: string
          nullable: true
          example: "Chrome"
        window_color:
          type: string
          nullable: true
          example: "Tinted"
        interior_color:
          type: string
          nullable: true
          example: "Black"
        production_code:
          type: string
          nullable: true
          example: "L2593"
        sku:
          type: string
          nullable: true
          example: "HCW35-N9B1"
        rarity_level:
          type: string
          enum: [Common, Uncommon, Rare, Chase, Super Treasure Hunt]
          example: "Common"
        estimated_production_quantity:
          type: integer
          nullable: true
          example: 50000
        msrp:
          type: number
          format: float
          nullable: true
          example: 1.29
        casting_name:
          type: string
          description: Included when relations are requested
          example: "'67 Camaro"
        series_name:
          type: string
          nullable: true
          description: Included when relations are requested
          example: "Mainline 2024"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CatalogStats:
      type: object
      properties:
        total_models:
          type: integer
          example: 15000
        total_castings:
          type: integer
          example: 2500
        total_series:
          type: integer
          example: 350
        models_by_rarity:
          type: object
          additionalProperties:
            type: integer
          example:
            Common: 12000
            Uncommon: 2000
            Rare: 800
            Chase: 150
            "Super Treasure Hunt": 50
        models_by_year:
          type: object
          additionalProperties:
            type: integer
          example:
            "2024": 500
            "2023": 480

    # ==================== Collection Schemas ====================
    CollectionItem:
      type: object
      properties:
        collection_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        model_id:
          type: integer
          example: 1
        acquisition_date:
          type: string
          format: date
          nullable: true
          example: "2024-06-15"
        acquisition_price:
          type: number
          format: float
          nullable: true
          example: 4.99
        condition:
          type: string
          enum: [Mint, Near Mint, Excellent, Good, Fair, Poor]
          example: "Mint"
        is_in_package:
          type: boolean
          example: true
        package_condition:
          type: string
          enum: [Mint, Near Mint, Excellent, Good, Fair, Poor]
          nullable: true
          example: "Mint"
        quantity:
          type: integer
          minimum: 1
          example: 1
        storage_location:
          type: string
          nullable: true
          example: "Display Case A"
        notes:
          type: string
          nullable: true
          example: "Found at local Walmart"
        is_for_trade:
          type: boolean
          example: false
        is_for_sale:
          type: boolean
          example: false
        car_model:
          $ref: '#/components/schemas/CarModel'
          description: Included when relations are requested
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AddToCollectionRequest:
      type: object
      required:
        - model_id
      properties:
        model_id:
          type: integer
          example: 1
        acquisition_date:
          type: string
          format: date
          example: "2024-06-15"
        acquisition_price:
          type: number
          format: float
          example: 4.99
        condition:
          type: string
          enum: [Mint, Near Mint, Excellent, Good, Fair, Poor]
          default: "Mint"
          example: "Mint"
        is_in_package:
          type: boolean
          default: true
          example: true
        package_condition:
          type: string
          enum: [Mint, Near Mint, Excellent, Good, Fair, Poor]
          example: "Mint"
        quantity:
          type: integer
          minimum: 1
          default: 1
          example: 1
        storage_location:
          type: string
          example: "Display Case A"
        notes:
          type: string
          example: "Found at local Walmart"
        is_for_trade:
          type: boolean
          default: false
          example: false
        is_for_sale:
          type: boolean
          default: false
          example: false

    UpdateCollectionItemRequest:
      type: object
      properties:
        acquisition_price:
          type: number
          format: float
          example: 5.99
        condition:
          type: string
          enum: [Mint, Near Mint, Excellent, Good, Fair, Poor]
          example: "Near Mint"
        is_in_package:
          type: boolean
          example: false
        package_condition:
          type: string
          enum: [Mint, Near Mint, Excellent, Good, Fair, Poor]
          nullable: true
        quantity:
          type: integer
          minimum: 1
        storage_location:
          type: string
        notes:
          type: string
        is_for_trade:
          type: boolean
        is_for_sale:
          type: boolean

    WishlistItem:
      type: object
      properties:
        wishlist_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        model_id:
          type: integer
          example: 1
        priority:
          type: integer
          minimum: 1
          maximum: 5
          example: 3
        max_price_willing:
          type: number
          format: float
          nullable: true
          example: 25.00
        notes:
          type: string
          nullable: true
          example: "Looking for loose or carded"
        car_model:
          $ref: '#/components/schemas/CarModel'
          description: Included when relations are requested
        created_at:
          type: string
          format: date-time

    AddToWishlistRequest:
      type: object
      required:
        - model_id
      properties:
        model_id:
          type: integer
          example: 1
        priority:
          type: integer
          minimum: 1
          maximum: 5
          example: 3
        max_price_willing:
          type: number
          format: float
          example: 25.00
        notes:
          type: string
          example: "Looking for loose or carded"

    CollectionStats:
      type: object
      properties:
        total_items:
          type: integer
          example: 150
        total_value:
          type: number
          format: float
          example: 750.50
        items_for_sale:
          type: integer
          example: 10
        items_for_trade:
          type: integer
          example: 25
        by_condition:
          type: object
          additionalProperties:
            type: integer
        by_rarity:
          type: object
          additionalProperties:
            type: integer

    # ==================== Marketplace Schemas ====================
    Listing:
      type: object
      properties:
        listing_id:
          type: integer
          example: 1
        seller_id:
          type: integer
          example: 1
        collection_item_id:
          type: integer
          nullable: true
          example: 5
        model_id:
          type: integer
          example: 1
        listing_type:
          type: string
          enum: [sale, trade, auction]
          example: "sale"
        price:
          type: number
          format: float
          nullable: true
          example: 15.99
          description: Required for sale listings, nullable for trades
        condition:
          type: string
          enum: [Mint, Near Mint, Excellent, Good, Fair, Poor]
          example: "Mint"
        description:
          type: string
          nullable: true
          example: "Pristine condition, never opened"
        status:
          type: string
          enum: [active, sold, cancelled, expired]
          example: "active"
        views_count:
          type: integer
          example: 42
        seller:
          type: object
          properties:
            username:
              type: string
              example: "hotwheels_fan"
            is_verified:
              type: boolean
              example: false
          description: Included when relations are requested
        car_model:
          $ref: '#/components/schemas/CarModel'
          description: Included when relations are requested
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        sold_at:
          type: string
          format: date-time
          nullable: true

    CreateListingRequest:
      type: object
      required:
        - model_id
        - listing_type
        - condition
      properties:
        model_id:
          type: integer
          example: 1
        listing_type:
          type: string
          enum: [sale, trade, auction]
          example: "sale"
        condition:
          type: string
          enum: [Mint, Near Mint, Excellent, Good, Fair, Poor]
          example: "Mint"
        price:
          type: number
          format: float
          example: 15.99
          description: Required for sale listings
        description:
          type: string
          example: "Pristine condition, never opened"
        collection_item_id:
          type: integer
          example: 5
          description: Link to your collection item
        expires_at:
          type: string
          format: date-time
          example: "2024-12-31T23:59:59Z"

    UpdateListingRequest:
      type: object
      properties:
        price:
          type: number
          format: float
          example: 14.99
        description:
          type: string
          example: "Updated description"
        condition:
          type: string
          enum: [Mint, Near Mint, Excellent, Good, Fair, Poor]

    Transaction:
      type: object
      properties:
        transaction_id:
          type: integer
          example: 1
        listing_id:
          type: integer
          example: 1
        buyer_id:
          type: integer
          example: 2
        seller_id:
          type: integer
          example: 1
        transaction_type:
          type: string
          enum: [purchase, trade]
          example: "purchase"
        amount:
          type: number
          format: float
          example: 15.99
        payment_method:
          type: string
          nullable: true
          example: "PayPal"
        payment_status:
          type: string
          enum: [pending, completed, failed, refunded]
          example: "pending"
        shipping_status:
          type: string
          enum: [not_shipped, shipped, in_transit, delivered]
          example: "not_shipped"
        tracking_number:
          type: string
          nullable: true
          example: "1Z999AA10123456784"
        buyer_username:
          type: string
          description: Included when relations are requested
          example: "buyer123"
        seller_username:
          type: string
          description: Included when relations are requested
          example: "seller456"
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    CreateTransactionRequest:
      type: object
      required:
        - listing_id
      properties:
        listing_id:
          type: integer
          example: 1
        payment_method:
          type: string
          example: "PayPal"

    Review:
      type: object
      properties:
        review_id:
          type: integer
          example: 1
        transaction_id:
          type: integer
          example: 1
        reviewer_id:
          type: integer
          example: 2
        reviewee_id:
          type: integer
          example: 1
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          nullable: true
          example: "Great seller, fast shipping!"
        reviewer_username:
          type: string
          description: Included when relations are requested
          example: "buyer123"
        reviewee_username:
          type: string
          description: Included when relations are requested
          example: "seller456"
        created_at:
          type: string
          format: date-time

    CreateReviewRequest:
      type: object
      required:
        - transaction_id
        - reviewee_id
        - rating
      properties:
        transaction_id:
          type: integer
          example: 1
        reviewee_id:
          type: integer
          example: 1
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          example: "Great seller, fast shipping!"

  responses:
    BadRequest:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              message: "Missing required fields: email, password"

    Unauthorized:
      description: Unauthorized - authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              message: "Authentication required"

    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              message: "Access forbidden"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              message: "Resource not found"

    Conflict:
      description: Conflict - resource already exists or invalid state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              message: "Email already registered"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              message: "An unexpected error occurred"

paths:
  # ==================== Health Check ====================
  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the API
      tags:
        - System
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  service:
                    type: string
                    example: "Hot Wheels API"
                  version:
                    type: string
                    example: "1.0.0"

  # ==================== Authentication ====================
  /api/v1/auth/register:
    post:
      summary: Register a new user
      description: |
        Creates a new user account with the provided credentials.

        **Password Requirements:**
        - Minimum 8 characters
        - Maximum 128 characters

        **Username Requirements:**
        - 3-50 characters
        - Must be unique
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              basic:
                summary: Basic registration
                value:
                  username: "hotwheels_fan"
                  email: "collector@example.com"
                  password: "SecureP@ss123"
              full:
                summary: Full registration with all fields
                value:
                  username: "hotwheels_fan"
                  email: "collector@example.com"
                  password: "SecureP@ss123"
                  full_name: "John Smith"
                  country: "United States"
                  city: "Los Angeles"
                  bio: "Collecting Hot Wheels since 1985"
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                  message:
                    type: string
                    example: "User registered successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/auth/login:
    post:
      summary: User login
      description: |
        Authenticates a user and returns JWT access and refresh tokens.

        **Token Usage:**
        - Access token expires in 24 hours
        - Refresh token expires in 30 days
        - Include access token in `Authorization: Bearer <token>` header
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "collector@example.com"
              password: "SecureP@ss123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AuthTokens'
                  message:
                    type: string
                    example: "Login successful"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      summary: User logout
      description: Logs out the current user and invalidates the session
      tags:
        - Authentication
      security:
