        - Collections
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCollectionRequest'
            examples:
              minimal:
                summary: Minimal - just model ID
                value:
                  model_id: 1
              full:
                summary: Full details
                value:
                  model_id: 1
                  acquisition_date: "2024-06-15"
                  acquisition_price: 4.99
                  condition: "Mint"
                  is_in_package: true
                  package_condition: "Mint"
                  quantity: 1
                  storage_location: "Display Case A"
                  notes: "Found at local Walmart"
                  is_for_trade: false
                  is_for_sale: false
      responses:
        '201':
          description: Added to collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
