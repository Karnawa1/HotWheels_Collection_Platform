  # ==================== Catalog ====================
  /api/v1/catalog/models:
    get:
      summary: Search car models
      description: |
        Search and filter car models with pagination.

        **Filtering:**
        - Search by casting name with `q` parameter
        - Filter by release year range
        - Filter by rarity level
        - Filter by color
        - Filter by series name
      tags:
        - Catalog
      parameters:
        - name: q
          in: query
          description: Search query (matches casting name)
          schema:
            type: string
          example: "Camaro"
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          description: Items per page (max 100)
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: year_min
          in: query
          description: Minimum release year
          schema:
            type: integer
            minimum: 1968
          example: 2020
        - name: year_max
          in: query
          description: Maximum release year
          schema:
            type: integer
          example: 2024
        - name: rarity
          in: query
          description: Rarity level filter
          schema:
            type: string
            enum: [Common, Uncommon, Rare, Chase, Super Treasure Hunt]
        - name: color
          in: query
          description: Color filter
          schema:
            type: string
          example: "Red"
        - name: series
          in: query
          description: Series name filter
          schema:
            type: string
          example: "Mainline"
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      models:
                        type: array
                        items:
                          $ref: '#/components/schemas/CarModel'
                      pagination:
                        $ref: '#/components/schemas/PaginationMeta'

