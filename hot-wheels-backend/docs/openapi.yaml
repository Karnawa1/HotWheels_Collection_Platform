          schema:
            type: boolean
        - name: for_trade
          in: query
          description: Filter items marked for trade
          schema:
            type: boolean
        - name: condition
          in: query
          description: Filter by condition
          schema:
            type: string
            enum: [Mint, Near Mint, Excellent, Good, Fair, Poor]
