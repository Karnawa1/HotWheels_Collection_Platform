# ===========================================
# Hot Wheels Platform - Docker Compose
# Base configuration for all environments
# ===========================================
# Usage:
#   Development: docker-compose up
#   Production:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ===========================================

services:
  # -----------------------------------------
  # PostgreSQL - Primary Database
  # -----------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: hotwheels_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotwheels_db}
      POSTGRES_USER: ${POSTGRES_USER:-hotwheels_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - hotwheels_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hotwheels_admin} -d ${POSTGRES_DB:-hotwheels_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # -----------------------------------------
  # Redis - Caching Layer
  # -----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: hotwheels_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secure_pass}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - hotwheels_backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # -----------------------------------------
  # MongoDB - NoSQL for Media Metadata
  # -----------------------------------------
  mongodb:
    image: mongo:7
    container_name: hotwheels_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-hotwheels_media}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./docker/mongodb/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - hotwheels_backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # -----------------------------------------
  # Flask API - Application Server
  # -----------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: hotwheels-api:${APP_VERSION:-1.0.0}
    container_name: hotwheels_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Flask settings
      FLASK_APP: run.py
      FLASK_ENV: ${FLASK_ENV:-development}
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      
      # Database connection
      DATABASE_URL: postgresql://${POSTGRES_USER:-hotwheels_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hotwheels_db}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-hotwheels_admin}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB:-hotwheels_db}
      
      # Redis connection
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_pass}
      
      # MongoDB connection
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-hotwheels_media}
      MONGO_USER: ${MONGO_ROOT_USER:-admin}
      MONGO_PASSWORD: ${MONGO_ROOT_PASSWORD}
      
      # Migrations
      AUTO_MIGRATE: ${AUTO_MIGRATE:-True}
      MIGRATIONS_DIR: /app/migrations
      
      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ACCESS_TOKEN_EXPIRES: ${JWT_ACCESS_TOKEN_EXPIRES:-86400}
      
      # API settings
      API_PORT: 5000
      API_HOST: 0.0.0.0
      
      # Gunicorn settings
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs:rw
      - ./uploads:/app/uploads:rw
    networks:
      - hotwheels_backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

# -----------------------------------------
# Volumes - Persistent Data Storage
# -----------------------------------------
volumes:
  postgres_data:
    driver: local
    name: hotwheels_postgres_data
  redis_data:
    driver: local
    name: hotwheels_redis_data
  mongodb_data:
    driver: local
    name: hotwheels_mongodb_data
  mongodb_config:
    driver: local
    name: hotwheels_mongodb_config

# -----------------------------------------
# Networks - Container Communication
# -----------------------------------------
networks:
  hotwheels_backend:
    driver: bridge
    name: hotwheels_network
