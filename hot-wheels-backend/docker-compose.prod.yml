# ===========================================
# Hot Wheels Platform - Production Override
# ===========================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ===========================================

services:
  # -----------------------------------------
  # PostgreSQL - Production Settings
  # -----------------------------------------
  postgres:
    restart: always
    environment:
      # Ensure password is set from secrets
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    # Stricter resource limits for production
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # -----------------------------------------
  # Redis - Production Settings
  # -----------------------------------------
  redis:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # -----------------------------------------
  # MongoDB - Production Settings
  # -----------------------------------------
  mongodb:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # -----------------------------------------
  # Flask API - Production Settings
  # -----------------------------------------
  api:
    image: hotwheels-api:${APP_VERSION:-1.0.0}
    restart: always
    environment:
      FLASK_ENV: production
      DEBUG: "False"
      LOG_LEVEL: WARNING
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
    # Production-level resources
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
      # Enable rollback on failure
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
    # Stricter healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"
    # Remove dev volume mounts, use built-in code
    volumes:
      - ./logs:/app/logs:rw
      - ./uploads:/app/uploads:rw

# -----------------------------------------
# Production Networks
# -----------------------------------------
networks:
  hotwheels_backend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"

